name: Bump @types/vscode

# Dependabot ignores @types/vscode (it cannot give one dependency a longer
# cooldown than the rest of its npm entry), so this workflow proposes the bump
# instead: the newest @types/vscode that has been on npm for at least 42 days,
# applied together with engines.vscode (vsce refuses to package when
# engines.vscode is lower). See scripts/bump-vscode-types.js.

on:
  schedule:
    # Mondays 04:00 UTC, the same slot as the Dependabot updates.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # needed to create the branch and push the bump
      pull-requests: write  # needed to open the PR

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pick the newest @types/vscode past the cooldown
        id: bump
        run: node scripts/bump-vscode-types.js | tee -a "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.bump.outputs.changed == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.2.2'

      - name: Setup Node.js
        if: steps.bump.outputs.changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Refresh the lockfile
        if: steps.bump.outputs.changed == 'true'
        working-directory: vscode-extension
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Create Pull Request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: update/vscode-types
          add-paths: |
            vscode-extension/package.json
            vscode-extension/pnpm-lock.yaml
          commit-message: "build(vscode-extension): bump @types/vscode and engines.vscode to ${{ steps.bump.outputs.to }}"
          title: "build(vscode-extension): bump @types/vscode and engines.vscode to ${{ steps.bump.outputs.to }}"
          body: |
            Raises `@types/vscode` and `engines.vscode` together from
            `${{ steps.bump.outputs.from }}` to `${{ steps.bump.outputs.to }}`.

            `${{ steps.bump.outputs.to }}` has been on npm for at least 42 days, so users on a slightly
            older VS Code build had time to update. **Merging this raises the minimum VS Code version
            the extension installs on.** Close it if you are not ready to drop support for older builds;
            the workflow reopens a fresh PR the next time a newer version passes the cooldown.

            Dependabot ignores `@types/vscode` on purpose; see the comment in `.github/dependabot.yml`.

            ---

            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: |
            autogenerated
            dependencies
