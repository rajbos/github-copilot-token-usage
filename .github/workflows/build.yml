name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  # Path gate. This workflow cross-compiles and tests the VS Code extension, so
  # a PR that only touches docs/, sharing-server/, jetbrains-plugin/ or the
  # Visual Studio extension has nothing here to run. Filtering in a gate job
  # rather than with a `paths:` trigger keeps build-and-test reporting a
  # (skipped) result, so it can stay a required status check - a `paths:`
  # trigger would leave those PRs waiting on a check that never arrives.
  # Mirrors the same pattern in cli-build.yml.
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      build-relevant: ${{ github.event_name == 'push' || steps.filter.outputs.build-relevant == 'true' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for build-relevant file changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            build-relevant:
              - 'vscode-extension/**'
              # The extension compiles the shared sources from the repo-root
              # src/ (see vscode-extension/tsconfig.json).
              - 'src/**'
              # Deliberately the whole directory, not just the two parse-*.js
              # files invoked directly below: this job also reaches repo-root
              # scripts/ indirectly through npm (today lint:json ->
              # validate-json.js, compile-tests -> prepare-test-output.js, and
              # the unit-test step would pick up run-node-unit-tests.js if it
              # ever switched from `node --test` to `npm test` the way ci.yml
              # runs it). Enumerating that set here would be a filter that
              # fails OPEN - the day an npm script picks up another root
              # helper, an explicit list silently stops triggering this build.
              # Re-derive the set before narrowing this glob; don't trust a
              # grep for `run: node scripts/...`, which misses every indirect
              # call.
              - 'scripts/**'
              - '.vscode/*.json'
              - '.devcontainer/devcontainer.json'
              - 'docs/logFilesSchema/session-file-schema.json'
              - 'docs/logFilesSchema/session-file-schema-analysis.json'
              - '.nvmrc'
              - '.github/workflows/build.yml'

  build-and-test:
    needs: check-changes
    if: needs.check-changes.outputs.build-relevant == 'true'
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        # ubuntu + windows only. macos-latest was dropped: its unique test
        # coverage is one path-layout assertion in toolCuration.test.ts (the
        # ~/Library/Application Support VS Code settings location), and that
        # test mirrors the production code's own conditional, so it would not
        # catch the two agreeing on a wrong path. Every other darwin
        # expectation is parameterised - normalizePathForDedup(p, 'darwin') -
        # and therefore runs on ubuntu already.
        #
        # windows-latest STAYS: cacheManager-snapshot.test.ts has a test gated
        # `skip: process.platform !== 'win32'` (the recycled-PID stale-lock
        # case), and ci.yml runs the unit suite on ubuntu only - so this row is
        # the single place in all of CI where that test executes. Dropping it
        # would not fail; the test would silently stop running. The UNC
        # backslash assertions in workspacePathResolver.test.ts are the same
        # story.
        os: [ubuntu-latest, windows-latest]
        # Single-entry matrix: 22.x was dropped - .nvmrc pins 24 and the rest
        # of CI builds on 24 only.
        node-version: [24.x]
    
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: '11.2.2'
    - name: Setup Node.js ${{ matrix.node-version }}
      if: matrix.os != 'windows-latest'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
        cache-dependency-path: vscode-extension/pnpm-lock.yaml

    - name: Setup Node.js ${{ matrix.node-version }} (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node-version }}
        
    - name: Install dependencies
      working-directory: vscode-extension
      run: pnpm install --frozen-lockfile --ignore-scripts
      
    - name: Validate JSON files
      working-directory: vscode-extension
      run: pnpm run lint:json
      
    - name: Run linting
      working-directory: vscode-extension
      run: pnpm run lint

    - name: Run complexity analysis
      working-directory: vscode-extension
      shell: bash
      run: pnpm run --silent lint:report > "$RUNNER_TEMP/lint-output.json" 2>/dev/null || true

    - name: Publish complexity results to step summary
      if: always() && matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x'
      shell: bash
      run: node scripts/parse-lint-output.js "$RUNNER_TEMP/lint-output.json" >> "$GITHUB_STEP_SUMMARY"

    - name: Run type checking
      working-directory: vscode-extension
      run: pnpm run check-types
      
    - name: Compile extension
      working-directory: vscode-extension
      run: pnpm run compile
      
    - name: Build production package
      working-directory: vscode-extension
      run: pnpm run package
      
    - name: Compile tests
      working-directory: vscode-extension
      run: pnpm run compile-tests
      
    - name: Run Node.js unit tests
      working-directory: vscode-extension
      shell: bash
      run: |
        set +e
        node --require ./out/vscode-extension/test/unit/vscode-shim-register.js \
          --experimental-test-coverage \
          --test \
          --test-force-exit \
          --test-coverage-include=out/vscode-extension/src/backend/**/*.js \
          --test-coverage-include=out/vscode-extension/src/utils/**/*.js \
          --test-coverage-include=out/src/utils/**/*.js \
          out/vscode-extension/test/unit/*.test.js 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
        status=${PIPESTATUS[0]}
        set -e
        exit "$status"

    - name: Publish test results to step summary
      if: always()
      shell: bash
      run: node scripts/parse-test-output.js "$RUNNER_TEMP/test-output.txt" >> "$GITHUB_STEP_SUMMARY"

    # Dependency-free node:test suites for repo-root scripts. The release
    # workflows depend on the changelog scripts to write and read the
    # changelog sections that become the GitHub release notes;
    # fetch-copilot-memories.test.js covers that script's pure helpers.
    # (loc-stats.test.js runs in its own loc-stats.yml workflow.)
    - name: Run repository script tests
      shell: bash
      run: node --test scripts/release-changelog.test.js scripts/sync-changelog.test.js scripts/fetch-copilot-memories.test.js

    - name: Verify build outputs exist
      shell: bash
      run: |
        if [ ! -f "vscode-extension/dist/extension.js" ]; then
          echo "❌ vscode-extension/dist/extension.js not found"
          exit 1
        fi
        if [ ! -d "vscode-extension/out" ]; then
          echo "❌ vscode-extension/out directory not found"
          exit 1
        fi
        echo "✅ Build outputs verified"
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x'
      with:
        name: build-artifacts
        path: |
          vscode-extension/dist/extension.js
          vscode-extension/dist/extension.js.map
          vscode-extension/out/
        retention-days: 7

  # Stable required-check anchor.
  #
  # build-and-test keeps a real matrix (2 OSes), and GitHub evaluates a
  # job-level `if` BEFORE expanding the matrix: when the gate skips it, the run
  # reports one skipped check named "build-and-test", not the two
  # "build-and-test (<os>, 24.x)" names it reports when it runs. A required
  # status check cannot match both spellings.
  #
  # Require "Build result" in branch protection rather than the per-OS entries.
  build-result:
    name: Build result
    runs-on: ubuntu-latest
    needs: [check-changes, build-and-test]
    if: always()
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # The composite action below is a local action (./.github/actions/...),
      # which needs the repo checked out at this path to be found at all -
      # without this, the step fails with "Can't find 'action.yml' ...".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the gated job results
        uses: ./.github/actions/check-gated-results
        with:
          gate-name: check-changes
          gate-result: ${{ needs.check-changes.result }}
          results: |
            build-and-test=${{ needs.build-and-test.result }}
