name: UI checks comment

# Posts the before/after/diff screenshot comment on a pull request.
#
# This is a `workflow_run` workflow on purpose. For a same-repository
# `pull_request`, GitHub runs the workflow definition AS IT IS IN THE PR, so a
# job that held GH_PAT inside ci.yml could be edited by the PR author (a new
# step before the posting step is enough to read the token). A `workflow_run`
# workflow always runs from the DEFAULT BRANCH, so the PR cannot change what
# runs next to the secret, and this file's checkout is the trusted default
# branch too (visual-diff-comment.js, views.config.json).
#
# The ci.yml `ui-checks` job runs PR code with no secrets and uploads the
# `webview-screenshots` artifact. This workflow only downloads it and treats it
# as untrusted data: it is never executed, nothing from it is interpolated into
# a shell command, and the renderer allowlists every field and verifies each
# image (regular file, size bound, PNG signature) before it is attached.
# Everything taken from the triggering event (PR number, base SHA, run URL) is
# supplied by GitHub, not by files the PR controls.
#
# Trade-offs to know about:
#   - A change to this file or to visual-diff-comment.js only takes effect once
#     it is on the default branch; the PR that introduces it cannot try it.
#   - It runs after CI finishes, so the comment appears a little later than the
#     ui-checks job, and a failure to post is a failure of THIS workflow, not
#     of the required "CI result" check.
#   - Fork and Dependabot PRs have no secrets and a read-only token, so they
#     are skipped; their screenshots stay in the artifact.
#
# gh only uploads with a user token, so the images use the repository's GH_PAT
# secret (the same one pr-risk-review.yml relies on) and the comment is authored
# by that user. Attaching files needs push access
# (https://docs.github.com/en/github-cli/github-cli/attaching-files-with-github-cli),
# which on a fine-grained PAT is Contents: write, plus Pull requests: write for
# the comment. gh's pre-flight checks the user's role, not the token's grants,
# so a token short of either fails mid-command with "not accessible by personal
# access token" (suffixed "(addComment)" for the comment half). Without the
# secret (or if gh fails) the comment is still posted with GITHUB_TOKEN, minus
# the inline images, pointing at the artifact and saying why.
# Rendering the comment and preparing gh are report-only. The posting step is
# NOT: it fails the workflow on an API error, or when a configured GH_PAT
# cannot deliver the images that were due. Non-fatal: an unset GH_PAT, and a
# rate-limited upload (retried once, then posted without images with a warning).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  ui-checks-comment:
    name: Webview screenshot comment
    runs-on: ubuntu-latest
    # Same-repository pull_request runs only (no secrets for forks), and not Dependabot.
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.actor.login != 'dependabot[bot]'
    permissions:
      actions: read # list the triggering run's jobs and download its artifact
      contents: read
      pull-requests: write # GITHUB_TOKEN fallback comment and cleanup of older comments
    # Two runs for rapid pushes could leave two comments; the newer wins.
    concurrency:
      group: ui-checks-comment-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
      cancel-in-progress: true
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    # No `ref:`: a workflow_run checkout is the default branch, which is the
    # trusted code this job is allowed to run.
    - name: Checkout default branch (trusted scripts only)
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Decide from GitHub-supplied facts only whether there is anything to post.
    - name: Decide whether to comment
      id: gate
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.event.workflow_run.id }}
        CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      run: |
        set -euo pipefail
        echo "run=false" >> "$GITHUB_OUTPUT"
        echo "skipped=false" >> "$GITHUB_OUTPUT"
        if [ "$CONCLUSION" = "cancelled" ]; then
          echo "CI run was cancelled (superseded); nothing to post."; exit 0
        fi
        if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
          echo "No pull request is associated with this run; nothing to post."; exit 0
        fi
        # ui-checks is path-gated. When it was skipped on this head, any
        # earlier screenshot comment is stale: carry on in "skipped" mode so
        # the post step replaces it (and posts nothing when none exists).
        ui_state="$(gh api --paginate "repos/${REPO}/actions/runs/${RUN_ID}/jobs" \
          --jq '.jobs[] | select(.name == "Webview UI checks") | .conclusion')"
        if [ "$ui_state" = "cancelled" ]; then
          echo "Webview UI checks were cancelled; nothing to post."; exit 0
        fi
        if [ -z "$ui_state" ] || [ "$ui_state" = "skipped" ]; then
          echo "skipped=true" >> "$GITHUB_OUTPUT"
        fi
        # A newer push has its own run; do not overwrite its comment with stale images.
        current_head="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .head.sha)"
        if [ "$current_head" != "$HEAD_SHA" ]; then
          echo "PR head moved on (${current_head}); this run is stale."; exit 0
        fi
        echo "run=true" >> "$GITHUB_OUTPUT"

    # Untrusted data from the PR's ui-checks run. Missing when ui-checks died
    # before uploading; the renderer then reports "no report".
    - name: Download screenshots artifact (untrusted data)
      if: steps.gate.outputs.run == 'true' && steps.gate.outputs.skipped != 'true'
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: webview-screenshots
        path: visual-output
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}

    - name: Render the screenshot comment
      id: visual-comment
      if: steps.gate.outputs.run == 'true' && steps.gate.outputs.skipped != 'true'
      continue-on-error: true
      env:
        RUN_URL: ${{ github.event.workflow_run.html_url }}
        BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
      run: |
        set -euo pipefail
        node .github/workflows/scripts/visual-diff-comment.js \
          --report visual-output/diff/report.json \
          --screenshots visual-output \
          --out-dir visual-comment \
          --run-url "$RUN_URL" \
          --artifact webview-screenshots \
          --base "$BASE_SHA"

    # ubuntu-latest may lag behind the gh release that added --attach. Pin a
    # known-good build and verify its checksum rather than trusting whatever
    # the image ships; the download is skipped when the image is new enough.
    - name: Ensure the GitHub CLI can attach images
      # The has_report output is empty when the render step was skipped for a
      # fork, so this is already fork-safe; the explicit guard keeps it so if
      # the render step's condition ever changes.
      if: steps.gate.outputs.run == 'true' && steps.visual-comment.outputs.has_report == 'true'
      continue-on-error: true
      env:
        GH_CLI_VERSION: "2.101.0"
        GH_CLI_SHA256: "9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8"
        GH_CLI_MIN_VERSION: "2.99.0"
      run: |
        set -euo pipefail
        have="$(gh --version 2>/dev/null | head -n1 | awk '{print $3}' || true)"
        if [ -n "$have" ] && [ "$(printf '%s\n%s\n' "$GH_CLI_MIN_VERSION" "$have" | sort -V | head -n1)" = "$GH_CLI_MIN_VERSION" ]; then
          echo "gh $have already supports --attach (needs $GH_CLI_MIN_VERSION+)."
          exit 0
        fi
        echo "gh ${have:-<missing>} is older than $GH_CLI_MIN_VERSION; installing $GH_CLI_VERSION."
        archive="$RUNNER_TEMP/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
        curl -fsSL --retry 3 -o "$archive" \
          "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
        echo "${GH_CLI_SHA256}  ${archive}" | sha256sum -c -
        tar -xzf "$archive" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/gh_${GH_CLI_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/gh_${GH_CLI_VERSION}_linux_amd64/bin/gh" --version

    - name: Post the screenshot comment on the PR
      # Runs without a report too (the render or the diff failed on this
      # push): an earlier push's screenshot comment would otherwise stay up,
      # showing before/after images that no longer describe this head.
      #
      # Deliberately NOT continue-on-error: this step used to swallow every
      # failure, so an expired GH_PAT left the job green and the PR without
      # screenshots for days. A configured-but-unusable PAT, a failed upload
      # and an API error now fail the job; only a PAT that is not configured
      # at all stays a notice. Dependabot runs are skipped outright: they get
      # neither secrets nor a writable GITHUB_TOKEN, so the image-free fallback
      # could not post either; their screenshots stay in the artifact.
      if: steps.gate.outputs.run == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # User token for the uploads; see the note above. Optional.
        GH_ATTACH_TOKEN: ${{ secrets.GH_PAT }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        RUN_URL: ${{ github.event.workflow_run.html_url }}
        HAS_REPORT: ${{ steps.visual-comment.outputs.has_report }}
        HAS_CHANGES: ${{ steps.visual-comment.outputs.has_changes }}
        ATTACHMENTS: ${{ steps.visual-comment.outputs.attachments }}
        COMMENT_MARKER: visual-view-diff
        # "true" when Webview UI checks did not run on this head.
        UI_SKIPPED: ${{ steps.gate.outputs.skipped }}
      run: |
        set -euo pipefail

        # Escape a value for a ::warning::/::error:: workflow command (the
        # encoding GitHub documents for command data). gh's error text and the
        # attachment list are outside input: an unescaped newline or %0A in
        # them would end the annotation early or start a new command.
        cmd_escape() {
          local s="$1"
          s="${s//'%'/%25}"
          s="${s//$'\r'/%0D}"
          s="${s//$'\n'/%0A}"
          printf '%s' "$s"
        }

        # The same outside text for a PR comment: first line only, no
        # Markdown/HTML/mention/escape characters, bounded length.
        comment_safe() {
          printf '%s' "$1" | head -n1 | tr -d '\r' | tr -c 'A-Za-z0-9 .,:;/()?=_-' ' ' | tr -s ' ' | cut -c1-300
        }

        # The identities this workflow posts as: the Actions bot, and the PAT's
        # user when one is configured. Only their comments are ever replaced,
        # so a person quoting the marker in their own comment keeps it.
        posters='"github-actions[bot]"'
        # gh's error when the PAT could not be used. A failed `gh api user`
        # can be a bad token or just a GitHub/network hiccup, so this keeps
        # gh's own words rather than guessing which.
        pat_error=""
        # Set when images were due and a configured token could not deliver
        # them. The comment is still posted (without images), then the step
        # fails so the problem is a red check rather than a silent gap.
        images_failed=""
        if [ -n "${GH_ATTACH_TOKEN:-}" ]; then
          pat_err_file="$(mktemp)"
          # Judge by gh's exit status, never by whether it printed something:
          # for an HTTP error gh writes the JSON error body to STDOUT, so a
          # revoked token used to yield a non-empty "login" that was spliced
          # into the jq program below and crashed it. The login is also
          # checked against GitHub's username shape before it is trusted.
          if pat_login="$(GH_TOKEN="$GH_ATTACH_TOKEN" gh api user --jq .login 2>"$pat_err_file")" \
            && [[ "$pat_login" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,38})$ ]]; then
            posters="${posters},\"${pat_login}\""
          else
            pat_error="$(head -n1 "$pat_err_file")"
            [ -n "$pat_error" ] || pat_error="$(printf '%s' "$pat_login" | tr '\n' ' ' | cut -c1-200)"
            pat_error="${pat_error:-gh gave no reason}"
            echo "::error::GH_PAT is set but could not be authenticated with 'gh api user' ($(cmd_escape "$pat_error")); posting without inline images. Rotate the secret."
            GH_ATTACH_TOKEN=""
            if [ "${ATTACHMENTS:-0}" -gt 0 ]; then images_failed=1; fi
          fi
        fi

        # Our earlier comments, oldest first. A comment is ours when it was
        # authored by one of our own identities (the Actions bot, or the user
        # behind the PAT this run holds) AND its body STARTS with the marker -
        # the renderer emits it as the very first line of its template, so a
        # comment that merely quotes it (a review reply discussing it, say)
        # never matches. Identity is the ownership proof; the body text only
        # narrows which of our comments this is. Nothing anyone else writes
        # can make their comment look like ours to this step. The cost: after
        # a PAT rotation, the comment the previous PAT's user posted is no
        # longer ours and stays until someone deletes it by hand.
        # `--slurp` gathers every page into one array before the jq filter
        # runs; with `--paginate` alone the filter runs once per page and the
        # output is one line per page, which the "newest" pick below would
        # misread on a PR with more than a page of comments. `gh api` refuses
        # to combine `--slurp` with its own `--jq`, so slurp via `gh api` and
        # filter with a separate `jq` invocation instead.
        list_ours() {
          GH_TOKEN="$GITHUB_TOKEN" gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --paginate --slurp \
            | jq "[.[][] | select(.user.login | IN(${posters})) | select(.body | startswith(\"<!-- ${COMMENT_MARKER} -->\")) | .id] | sort | join(\" \")" -r
        }
        existing="$(list_ours)"

        # No report on this push (the render or the diff failed): nothing to
        # show, but a comment from an earlier push must not keep describing
        # screenshots this head never produced, so one that exists is replaced
        # by a notice below.
        if [ "$HAS_REPORT" != "true" ] && [ -z "$existing" ]; then
          echo "No visual diff report and no earlier screenshot comment; nothing to post."
          exit 0
        fi

        # A PR with no visual change gets no comment - unless an earlier push
        # did change something, in which case the stale comment is replaced by
        # the all-clear rather than silently deleted.
        if [ "$HAS_REPORT" = "true" ] && [ "$HAS_CHANGES" != "true" ] && [ -z "$existing" ]; then
          echo "No visual changes and no earlier screenshot comment; nothing to post."
          exit 0
        fi

        # Re-check every attachment here, with the token in hand: only a
        # regular, non-symlinked PNG directly under one of the three screenshot
        # directories is ever handed to gh. The renderer already enforces this;
        # the step it produced its list in did not hold the token, this one does.
        post_with_images() {
          [ -n "${GH_ATTACH_TOKEN:-}" ] || return 1
          [ "${ATTACHMENTS:-0}" -gt 0 ] || return 1
          args=()
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            file="${line%%#*}"
            case "$file" in
              visual-output/baseline/*.png|visual-output/current/*.png|visual-output/diff/*.png) ;;
              *) echo "::error::Refusing to attach '$(cmd_escape "$file")': not a screenshot path."; return 1 ;;
            esac
            case "${file#visual-output/*/}" in
              */*|*..*) echo "::error::Refusing to attach '$(cmd_escape "$file")': nested or relative path."; return 1 ;;
            esac
            if [ -L "$file" ] || [ ! -f "$file" ]; then
              echo "::error::Refusing to attach '$(cmd_escape "$file")': not a regular file."; return 1
            fi
            # The artifact is PR-controlled data: only a real, bounded PNG goes out.
            if [ "$(stat -c %s "$file")" -gt 10485760 ] || [ "$(head -c 8 "$file" | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]; then
              echo "::error::Refusing to attach '$(cmd_escape "$file")': not a PNG within the size limit."; return 1
            fi
            args+=(--attach "$line")
          done < visual-comment/attachments.txt
          [ "${#args[@]}" -gt 0 ] || return 1
          # gh's own explanation is the diagnosis (which file, which HTTP
          # status, what the endpoint said); keep it for the annotation so
          # the reason is on the checks page, not buried in the job log.
          attach_once() {
            upload_error="$(GH_TOKEN="$GH_ATTACH_TOKEN" gh pr comment "$PR_NUMBER" --repo "$REPO" \
              --body-file visual-comment/comment.md "${args[@]}" 2>&1 >/dev/null)"
          }
          if ! attach_once; then
            # The API quota is shared with every other job and agent. A rate
            # limit says nothing about the token, so wait once and retry.
            if printf '%s' "$upload_error" | grep -qi 'rate limit'; then
              echo "::notice::gh pr comment --attach hit the API rate limit; retrying once in 60s."
              sleep 60
              attach_once && return 0
            fi
            printf '%s\n' "$upload_error"
            return 1
          fi
        }

        post_plain() {
          GH_TOKEN="$GITHUB_TOKEN" gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -F body=@visual-comment/comment-plain.md > /dev/null
        }

        if [ "$HAS_REPORT" != "true" ]; then
          notice=no-report
          [ "$UI_SKIPPED" = "true" ] && notice=skipped
          # Default-branch script, fixed arguments: the notice text is not artifact data.
          node .github/workflows/scripts/visual-diff-comment.js \
            --notice "$notice" --out-dir visual-comment --marker "$COMMENT_MARKER" --run-url "$RUN_URL"
          post_plain
          echo "Replaced the earlier screenshot comment with a ${notice} notice."
        elif post_with_images; then
          echo "Posted the screenshot comment with ${ATTACHMENTS} inline image(s)."
        else
          # Why the images are missing, for the comment itself as well as the
          # annotation: a warning on the checks page is where this failure
          # went unnoticed for weeks. Empty when there were no images to show.
          why=""
          if [ -n "$pat_error" ]; then
            [ "${ATTACHMENTS:-0}" -gt 0 ] && why="the \`GH_PAT\` secret could not be authenticated (\`gh api user\`: \`$(comment_safe "$pat_error")\`)."
          elif [ -z "${GH_ATTACH_TOKEN:-}" ]; then
            echo "::notice::GH_PAT is not configured, so the screenshot comment links to the artifact instead of embedding images. Add a user PAT as the GH_PAT secret to inline them: a classic PAT needs the repo scope; a fine-grained one needs Contents: write (the upload) and Pull requests: write (the comment) on this repository."
            [ "${ATTACHMENTS:-0}" -gt 0 ] && why="the \`GH_PAT\` secret is not configured."
          elif [ "${ATTACHMENTS:-0}" -gt 0 ]; then
            # One line, so it survives as a workflow annotation.
            reason="$(printf '%s' "${upload_error:-}" | grep -m1 -E 'upload|HTTP|attach|GraphQL' || printf '%s' "${upload_error:-}" | head -n1)"
            hint=""
            case "$reason" in
              # gh uploads first and then posts the comment with the same
              # token, so the same 403 text can come from either half.
              *"(addComment)"*)
                hint=" The fine-grained GH_PAT can upload but cannot comment: it needs Pull requests: write on this repository." ;;
              *"not accessible by personal access token"*)
                hint=" The fine-grained GH_PAT is missing a permission; for the upload that is most likely Contents: write (push access) on this repository." ;;
              *"requires write access"*)
                hint=" The GH_PAT user needs write access to this repository." ;;
            esac
            # Not "uploading failed": gh uploads and then comments, and either
            # half can be the one that failed; gh's reason says which.
            if printf '%s' "${upload_error:-}" | grep -qi 'rate limit'; then
              # Transient and shared-quota: the comment still goes out without
              # images, and the workflow is not failed over it.
              echo "::warning::gh pr comment --attach was rate limited twice; posting the comment without inline images. $(cmd_escape "${reason:-gh gave no reason}")"
              hint=" GitHub's API rate limit was exceeded; this is temporary and not a token problem."
            else
              echo "::error::gh pr comment --attach failed; posting the comment without inline images. $(cmd_escape "${reason:-gh gave no reason}").${hint}"
              images_failed=1
            fi
            why="\`gh pr comment --attach\` failed: \`$(comment_safe "${reason:-gh gave no reason}")\`.${hint}"
          fi
          if [ -n "$why" ]; then
            # Right under the heading; the marker must stay the first line.
            printf '> [!WARNING]\n> Inline screenshots could not be attached: %s See the [workflow run](%s).\n\n' \
              "$why" "$RUN_URL" > visual-comment/why.md
            awk 'NR==FNR { note = note $0 "\n"; next } { print } FNR==3 { printf "%s", note }' \
              visual-comment/why.md visual-comment/comment-plain.md > visual-comment/comment-plain.tmp
            mv visual-comment/comment-plain.tmp visual-comment/comment-plain.md
          fi
          post_plain
          echo "Posted the screenshot comment without inline images."
        fi

        # Keep only the newest of our marker comments. Listing again after
        # posting (rather than deleting the ids captured before) means two
        # runs that raced past the concurrency group still converge on one
        # surviving comment instead of each sparing its own.
        all="$(list_ours)"
        newest="${all##* }"
        for id in $all; do
          [ "$id" = "$newest" ] && continue
          GH_TOKEN="$GITHUB_TOKEN" gh api --method DELETE "repos/${REPO}/issues/comments/${id}" > /dev/null \
            && echo "Removed the previous screenshot comment ${id}." \
            || echo "::warning::Could not remove the previous screenshot comment ${id}."
        done

        if [ -n "$images_failed" ]; then
          echo "::error::The screenshot comment was posted without inline images (see the annotations above); failing the step so the broken GH_PAT or its scopes get fixed."
          exit 1
        fi
