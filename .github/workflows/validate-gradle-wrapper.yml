name: Validate Gradle Wrapper

on:
  push:
    paths:
      - '.github/workflows/validate-gradle-wrapper.yml'
      - 'jetbrains-plugin/gradlew'
      - 'jetbrains-plugin/gradlew.bat'
      - 'jetbrains-plugin/gradle/wrapper/**'
  pull_request:
    paths:
      - '.github/workflows/validate-gradle-wrapper.yml'
      - 'jetbrains-plugin/gradlew'
      - 'jetbrains-plugin/gradlew.bat'
      - 'jetbrains-plugin/gradle/wrapper/**'

permissions:
  contents: read

jobs:
  validate-gradle-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper JAR
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          min-wrapper-count: 1
