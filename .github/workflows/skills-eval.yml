name: Agent Skills Eval

# Weekly evaluation of the Agent Skills in .github/skills using
# https://github.com/darkrishabh/agent-skills-eval, with the GitHub Copilot
# CLI acting as both the target and judge model (see
# .github/workflows/scripts/skills-eval.mjs). Only skills that ship an
# evals/evals.json are evaluated; the rest are skipped by the tool.
#
# No validate-input.sh step: this workflow runs on trusted triggers only
# (schedule / workflow_dispatch / push to workflow files) and never reads
# user-authored event text.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model for the Copilot CLI (blank = CLI default)"
        required: false
        default: ""
  schedule:
    - cron: '15 6 * * 1'  # Every Monday at 06:15 UTC
  push:
    paths:
      - .github/workflows/skills-eval.yml
      - .github/workflows/scripts/skills-eval.mjs

permissions:
  contents: read

jobs:
  skills-eval:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && !startsWith(github.ref_name, 'dependabot/')
    timeout-minutes: 90

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Check the Copilot CLI token
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "❌ GH_PAT secret is not configured — the Copilot CLI cannot authenticate."
            exit 1
          fi
          gh auth status
          npx --yes @github/copilot --version

      - name: Install agent-skills-eval
        working-directory: .github/workflows/dependencies/agent-skills-eval
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run agent-skills-eval via the Copilot CLI
        id: eval
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          EVAL_PKG_DIR: .github/workflows/dependencies/agent-skills-eval
          COPILOT_MODEL: ${{ inputs.model || '' }}
          SKILLS_ROOT: .github/skills
          EVAL_WORKSPACE: ./agent-skills-workspace
        run: node .github/workflows/scripts/skills-eval.mjs

      - name: Upload eval workspace (raw prompts, outputs and gradings)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-skills-eval-workspace
          path: agent-skills-workspace/
          if-no-files-found: warn
          retention-days: 90

      # The report also lives inside the workspace artifact above, but it is
      # buried several levels deep in a large zip. Upload the report directory
      # itself (reported by the eval script) so this artifact unzips to a bare
      # index.html that can be opened directly.
      - name: Upload HTML report
        if: always() && steps.eval.outputs.report-dir != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-skills-eval-report
          path: ${{ steps.eval.outputs.report-dir }}
          if-no-files-found: warn
          retention-days: 90
