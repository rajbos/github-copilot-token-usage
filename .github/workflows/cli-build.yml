name: CLI - Build & Validate

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'src/**'
      - 'docs/cli/README.md'
      - '.nvmrc'
      - 'vscode-extension/src/**'
      - 'vscode-extension/package.json'
      - 'vscode-extension/pnpm-lock.yaml'
      - 'vscode-extension/pnpm-workspace.yaml'
      - '.github/workflows/cli-build.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      cli-relevant: ${{ github.event_name == 'push' || steps.filter.outputs.cli-relevant == 'true' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for CLI-relevant file changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            cli-relevant:
              - 'cli/**'
              - 'src/**'
              - 'docs/cli/README.md'
              - '.nvmrc'
              - 'vscode-extension/src/**'
              - 'vscode-extension/package.json'
              - 'vscode-extension/pnpm-lock.yaml'
              - 'vscode-extension/pnpm-workspace.yaml'
              - '.github/workflows/cli-build.yml'

  build-and-validate:
    needs: check-changes
    if: needs.check-changes.outputs.cli-relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.2.2'

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          # This job installs dependencies in both vscode-extension/ and cli/, so the
          # pnpm cache is keyed on both lock files.
          cache: 'pnpm'
          cache-dependency-path: |
            vscode-extension/pnpm-lock.yaml
            cli/pnpm-lock.yaml

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install CLI dependencies
        working-directory: cli
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build CLI
        working-directory: cli
        run: pnpm run build

      # Lints cli/src with the extension's ESLint and config (the CLI has no
      # eslint of its own). Findings are warnings, so this reports without
      # failing; new errors fail the job.
      - name: Lint CLI sources
        working-directory: cli
        run: pnpm run lint

      # Needs the build above: some tests import the built library from dist/lib.
      - name: Run CLI unit tests
        working-directory: cli
        run: pnpm run test:unit

      - name: Validate CLI --help
        working-directory: cli
        run: node dist/cli.js --help

      - name: Validate CLI --version
        working-directory: cli
        run: node dist/cli.js --version

      - name: Validate stats command
        working-directory: cli
        run: node dist/cli.js stats --verbose

      - name: Validate usage command
        working-directory: cli
        run: node dist/cli.js usage

      - name: Validate environmental command
        working-directory: cli
        run: node dist/cli.js environmental

      - name: Validate fluency command
        working-directory: cli
        run: node dist/cli.js fluency --tips

      - name: Validate diagnostics command
        working-directory: cli
        run: node dist/cli.js diagnostics

      - name: Validate chart command
        working-directory: cli
        run: node dist/cli.js chart --json

      - name: Validate usage-analysis command
        working-directory: cli
        run: node dist/cli.js usage-analysis --json

      - name: Validate all command (batched data for Visual Studio extension)
        working-directory: cli
        run: node dist/cli.js all --json

      - name: Build production bundle
        working-directory: cli
        run: pnpm run build:production

      - name: Verify production bundle runs
        working-directory: cli
        run: node dist/cli.js --help
