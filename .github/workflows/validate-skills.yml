name: Validate Skills

on:
  push:
    paths:
      - "*"
      - ".github/skills/**"
      - "scripts/validate-skill-security.js"
      - "scripts/validate-skill-security.test.js"
      # load-cache-data's test classifies every cache field in src/types.ts
      - "src/types.ts"
      - ".github/workflows/validate-skills.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/skills/**"
      - "scripts/validate-skill-security.js"
      - "scripts/validate-skill-security.test.js"
      # load-cache-data's test classifies every cache field in src/types.ts
      - "src/types.ts"
      - ".github/workflows/validate-skills.yml"

concurrency:
  group: validate-skills-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true && github.actor != 'dependabot[bot]'
    outputs:
      skills: ${{ steps.changed-skills.outputs.skills }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get changed skills
        id: changed-skills
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
            HEAD=${{ github.event.pull_request.head.sha }}
          else
            BASE=${{ github.event.before }}
            HEAD=${{ github.event.after }}
          fi

          # Find changed files in .github/skills and extract skill directories.
          # Filtered in jq, not grep: grep exits 1 on no match, which under
          # pipefail fails the job when no skill directory changed.
          SKILLS=$(git diff --name-only $BASE $HEAD | \
            jq -R -s -c '[split("\n")[]
              | select(startswith(".github/skills/"))
              | select(. != ".github/skills/README.md"
                  and . != ".github/skills/skill-security-classification.json")
              | split("/")[0:3] | join("/")] | unique')

          echo "skills=$SKILLS" >> "$GITHUB_OUTPUT"
          echo "Changed skills: $SKILLS"

  validate:
    needs: detect-changes
    if: needs.detect-changes.outputs.skills != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.detect-changes.outputs.skills) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate ${{ matrix.skill }}
        uses: Flash-Brew-Digital/validate-skill@39c9da973b7ce3fd4d9632672a0c355bdd733d89  # v1.0.0
        with:
          path: ${{ matrix.skill }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      # Skill scripts' own unit tests (*.test.js next to the script). Skill-only
      # changes are path-gated away from the main build, so this is the only
      # place they run in CI.
      - name: Run ${{ matrix.skill }} unit tests
        env:
          SKILL_DIR: ${{ matrix.skill }}
        run: |
          mapfile -t TESTS < <(find "$SKILL_DIR" -name '*.test.js' -not -path '*/node_modules/*' | sort)
          if [ "${#TESTS[@]}" -eq 0 ]; then
            echo "No unit tests in $SKILL_DIR"
            exit 0
          fi
          node --test "${TESTS[@]}"

  # Skill security classification: every skill that ships scripts carries a
  # SECURITY.md or is declared exempt/pending in
  # .github/skills/skill-security-classification.json. Checks ALL skills, not
  # just the changed ones, so editing only the classification file cannot leave
  # a stale entry. See "Skill security classification" in AGENTS.md.
  security-classification:
    name: Skill security classification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Test the validator
        run: node --test scripts/validate-skill-security.test.js

      - name: Validate skill security classification
        run: node scripts/validate-skill-security.js

      - name: Test the azure-storage-loader hardening
        run: node --test .github/skills/azure-storage-loader/load-table-data.test.js

      # The pr-risk-review scripts turn model output over an untrusted diff
      # into a PR comment; these are the regression tests for their sanitizer
      # and rename handling (#2307).
      - name: Test the pr-risk-review scripts
        run: node --test .github/skills/pr-risk-review/tests/pr-risk-review.test.js

      # Pins load-cache-data's redaction and cache-source rules (its SECURITY.md
      # mitigations), including the field classification checked against
      # src/types.ts. Dependency-free: node:test only.
      - name: Test load-cache-data redaction contract
        run: node --test .github/skills/load-cache-data/load-cache-data.test.js
