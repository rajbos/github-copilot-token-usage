name: actionlint

on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  run-actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Block all outbound calls except allowed)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          # Allowlist inferred from the harden-runner audit output of the 10 most
          # recent successful runs of this workflow (run ids 28548602130..28791579209).
          allowed-endpoints: >
            auth.docker.io:443
            github.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            results-receiver.actions.githubusercontent.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: devops-actions/actionlint@ec02b36684b2f574f1d219ad0a43b082e46bf3e4 # v0.1.13
