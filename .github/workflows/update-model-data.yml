name: Update Model Data

on:
  schedule:
    # Run daily at 08:15 UTC, shortly after the source repo typically publishes.
    - cron: '15 8 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-model-data.yml
      - scripts/update-model-data.py

permissions:
  contents: read

jobs:
  update-model-data:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && !startsWith(github.ref_name, 'dependabot/')

    permissions:
      contents: write      # needed to create branches and push changes
      pull-requests: write  # needed to create PRs

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Update model data from notifier
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update-model-data.py | tee /tmp/update-output.txt
          # Extract the source SHA for the PR body
          SOURCE_SHA=$(grep '^SOURCE_SHA=' /tmp/update-output.txt | cut -d= -f2 || echo '<unknown>')
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          cat /tmp/update-output.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.2.2'
      - name: Setup Node.js (for JSON validation)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: vscode-extension/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: vscode-extension
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate JSON files
        working-directory: vscode-extension
        run: pnpm run lint:json

      - name: Create Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: update/model-data
          add-paths: |
            src/modelPricing.json
            src/tokenEstimators.json
          commit-message: |
            chore: sync model data from rajbos/github-copilot-model-notifier

            Updates pricing, multiplier and tier values in modelPricing.json,
            refreshes releaseStatus in copilotPricing blocks, and adds new
            models published by the notifier (using its pricing data when
            available, otherwise a $0.00 stub for manual verification).

            Source SHA: ${{ steps.update.outputs.source_sha }}
          title: "chore: sync model data from rajbos/github-copilot-model-notifier"
          body: |
            This pull request updates model configuration files with the latest
            data from [rajbos/github-copilot-model-notifier](https://github.com/rajbos/github-copilot-model-notifier/blob/main/data/models.json).

            **Updated Files:**
            - `src/modelPricing.json` — model pricing, multipliers, tiers, and `copilotPricing.releaseStatus`
            - `src/tokenEstimators.json` — token estimators for new models

            **⚠️ Note:** New models are populated with the source's pricing data
            when available. If the source has no pricing yet for a model, it is
            added as a `$0.00` stub and flagged in the workflow summary for
            manual verification before merging. See the
            [pricing sources](https://github.com/rajbos/ai-engineering-fluency/blob/main/src/modelPricing.json#L6)
            in `modelPricing.json` for reference URLs.

            **Source data SHA:** `${{ steps.update.outputs.source_sha }}`

            ---

            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: |
            autogenerated
            maintenance

      - name: Summary
        run: |
          if [ "${{ steps.create_pr.outputs.pull-request-created }}" == "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ Pull request created: ${{ steps.create_pr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.create_pr.outputs.pull-request-number }}" != "" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "🔄 Existing pull request updated: ${{ steps.create_pr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "ℹ️ Model data is already up to date — no pull request needed." >> "$GITHUB_STEP_SUMMARY"
          fi
