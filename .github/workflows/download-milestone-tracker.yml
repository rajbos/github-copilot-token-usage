name: Download Milestone Tracker

on:
  schedule:
    # Sunday night UTC
    - cron: '0 22 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# The issue step checks for an open issue before creating one, which is only
# safe if runs never overlap. Queue a second run instead of cancelling it.
concurrency:
  group: download-milestone-tracker
  cancel-in-progress: false

jobs:
  check-milestone:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Restore last announced milestone
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/download-milestone-state.json
          key: download-milestone-state-${{ github.run_id }}
          restore-keys: |
            download-milestone-state-

      - name: Check for a new download milestone
        id: milestone
        run: python scripts/check-download-milestone.py

      # The cached state can be evicted, which makes the script report an
      # already-announced milestone as new again. The open issues are the
      # source of truth: an open issue for this milestone means there is
      # nothing to do, and a new milestone supersedes the previous issue.
      - name: Create milestone issue
        if: steps.milestone.outputs.milestone_reached == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MILESTONE_FORMATTED: ${{ steps.milestone.outputs.milestone_formatted }}
        run: |
          set -euo pipefail
          prefix="🎉 Download milestone:"
          title="${prefix} ${MILESTONE_FORMATTED} total downloads"

          open_issues=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --label "autogenerated" \
            --limit 100 \
            --json number,title)

          existing=$(jq -r --arg title "$title" \
            '[.[] | select(.title == $title)] | sort_by(.number) | first | .number // empty' \
            <<< "$open_issues")
          if [ -n "$existing" ]; then
            echo "Issue #${existing} for the ${MILESTONE_FORMATTED} milestone is already open, nothing to do."
            exit 0
          fi

          new_url=$(gh issue create \
            --repo "$REPO" \
            --title "$title" \
            --body-file /tmp/download-milestone-issue-body.md \
            --label "autogenerated")
          new_number="${new_url##*/}"
          echo "Created issue #${new_number}: ${new_url}"

          jq -r --arg prefix "$prefix" --argjson new "$new_number" \
            '.[] | select((.title | startswith($prefix)) and .number != $new) | .number' \
            <<< "$open_issues" |
          while read -r previous; do
            echo "Closing #${previous} as superseded by #${new_number}"
            gh issue close "$previous" \
              --repo "$REPO" \
              --reason "not planned" \
              --comment "Superseded by #${new_number}."
          done

      # Only re-saved when a new milestone was actually reached, so the cache
      # entry (and thus the "last milestone we alerted on") only advances
      # once we've successfully announced it.
      - name: Save milestone state
        if: steps.milestone.outputs.milestone_reached == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/download-milestone-state.json
          key: download-milestone-state-${{ github.run_id }}
