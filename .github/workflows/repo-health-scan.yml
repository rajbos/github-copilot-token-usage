name: Repo Health Scan

# Daily code-health scan across eight topics (style & validation, naming,
# complexity, large files, dead code, duplication, modularization, tech debt).
#
# - scan (always): runs scripts/repo-health-scan.js — deterministic, no AI cost —
#   writes the report to the step summary and refreshes one long-lived
#   "Repo health dashboard" issue (label: repo-health-dashboard) with the counts
#   and their change since the previous run. That issue is the debt tracker.
# - copilot-handoff (opt-in, costs AI credits): picks ONE untracked finding,
#   opens a `repo-health` issue for it and assigns it to the Copilot coding
#   agent, which works it per .github/agents/repo-health-scan.agent.md.
#   Enable with the repository variable REPO_HEALTH_COPILOT_HANDOFF=true (for
#   the schedule) or the `copilot_handoff` input on a manual run. Leave it off
#   when the fixing half runs as a local Claude Code routine instead
#   (docs/REPO-HEALTH-SCAN.md).

on:
  schedule:
    - cron: '23 5 * * *' # daily 05:23 UTC
  workflow_dispatch:
    inputs:
      copilot_handoff:
        description: 'Open an issue for one finding and assign it to the Copilot coding agent'
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/repo-health-scan.yml
      - scripts/repo-health-scan.js
      - scripts/repo-health-scan.test.js

permissions:
  contents: read

# Scheduled and manual runs refresh the dashboard and may open an issue, so
# they share ONE group whatever the ref: two concurrent runs could otherwise
# pick and open the same finding. They queue rather than cancel, so a handoff
# is never cut off between creating and assigning its issue. Pull-request runs
# only run the unit tests and stay isolated per ref.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('repo-health-scan-pr-{0}', github.ref) || 'repo-health-scan-mutating' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Run scanner unit tests
        run: node --test scripts/repo-health-scan.test.js

  scan:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read # download the previous run's report artifact (trend baseline)
      issues: write # refresh the dashboard issue
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.2.2'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          cache-dependency-path: vscode-extension/pnpm-lock.yaml

      - name: Install vscode-extension dependencies (ESLint)
        working-directory: vscode-extension
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run repo health scan
        run: |
          mkdir -p "$RUNNER_TEMP/repo-health"
          node scripts/repo-health-scan.js --json --out "$RUNNER_TEMP/repo-health/report.json"
          node scripts/repo-health-scan.js --from "$RUNNER_TEMP/repo-health/report.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repo-health-report
          path: ${{ runner.temp }}/repo-health/report.json
          retention-days: 30

      # The trend baseline is the previous run's own report artifact — a store
      # only this workflow writes — never the editable dashboard issue body.
      # Only default-branch schedule/manual runs count; the newest one that
      # still has the artifact wins (a later job failing doesn't break this).
      - name: Download the previous run's report (trend baseline)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          candidates=$(gh run list --repo "$REPO" --workflow repo-health-scan.yml --branch "$DEFAULT_BRANCH" \
            --status completed --limit 10 --json databaseId,event \
            --jq ".[] | select(.databaseId != $RUN_ID and (.event == \"schedule\" or .event == \"workflow_dispatch\")) | .databaseId")
          for id in $candidates; do
            if gh run download "$id" --repo "$REPO" -n repo-health-report -D "$RUNNER_TEMP/previous" 2>/dev/null; then
              echo "Trend baseline: report from run $id" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "No previous report artifact found; the dashboard has no change column this run." >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh the dashboard issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh label create repo-health-dashboard --repo "$REPO" --color 5319e7 \
            --description "Daily repo-health tracking issue" 2>/dev/null || true
          gh label create technical-debt --repo "$REPO" 2>/dev/null || true
          number=$(gh issue list --repo "$REPO" --label repo-health-dashboard --state open \
            --limit 1 --json number --jq '.[0].number // empty')
          node scripts/repo-health-scan.js --dashboard --from "$RUNNER_TEMP/repo-health/report.json" \
            --previous "$RUNNER_TEMP/previous/report.json" --out "$RUNNER_TEMP/dashboard.md"
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$REPO" --body-file "$RUNNER_TEMP/dashboard.md"
            echo "Updated dashboard issue #$number" >> "$GITHUB_STEP_SUMMARY"
          else
            gh issue create --repo "$REPO" --title "Repo health dashboard" \
              --label repo-health-dashboard --label technical-debt --body-file "$RUNNER_TEMP/dashboard.md"
          fi

  copilot-handoff:
    needs: scan
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.copilot_handoff) ||
      (github.event_name == 'schedule' && vars.REPO_HEALTH_COPILOT_HANDOFF == 'true')
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Download scan report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repo-health-report
          path: ${{ runner.temp }}/repo-health

      # Assigning an issue to the Copilot coding agent needs a user token;
      # GITHUB_TOKEN cannot. GH_PAT is the same secret sync-toolnames.yml uses.
      # The issue is created unassigned, validated, and only then assigned.
      - name: Open an issue for one finding
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          MAX_OPEN_PRS: '3'
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_PAT is not set; cannot assign issues to Copilot."
            exit 1
          fi
          open_prs=$(gh pr list --repo "$REPO" --label repo-health --state open --json number --jq length)
          if [ "$open_prs" -ge "$MAX_OPEN_PRS" ]; then
            echo "$open_prs repo-health PRs already open (limit $MAX_OPEN_PRS); skipping handoff." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh label create repo-health --repo "$REPO" --color 0e8a16 \
            --description "Daily repo-health scan finding" 2>/dev/null || true
          gh api --paginate "repos/$REPO/issues?labels=repo-health&state=all&per_page=100" \
            --jq '.[].body' > "$RUNNER_TEMP/tracked.json"
          node scripts/repo-health-scan.js --pick --from "$RUNNER_TEMP/repo-health/report.json" \
            --tracked "$RUNNER_TEMP/tracked.json" --out "$RUNNER_TEMP/pick.json"
          if [ "$(jq -r '.finding == null' "$RUNNER_TEMP/pick.json")" = "true" ]; then
            echo "No untracked finding to hand off." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq -r '.issue.title' "$RUNNER_TEMP/pick.json" > "$RUNNER_TEMP/issue-title.txt"
          {
            jq -r '.issue.body' "$RUNNER_TEMP/pick.json"
            echo
            echo "_@copilot: work this with \`.github/agents/repo-health-scan.agent.md\`, starting at Step 4._"
          } > "$RUNNER_TEMP/issue.md"
          url=$(gh issue create --repo "$REPO" --title "$(cat "$RUNNER_TEMP/issue-title.txt")" \
            --body-file "$RUNNER_TEMP/issue.md" --label repo-health --label technical-debt)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"

      # The finding text is quoted from repository content. The scanner already
      # strips hidden characters and HTML comments; this is the repo's standard
      # gate (see workflows.instructions.md), run before an AI agent sees it.
      # On failure it comments on the issue and fails the job, leaving it unassigned.
      - name: Validate the issue for hidden content
        if: steps.issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ITEM_NUMBER: ${{ steps.issue.outputs.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          CONTEXT_TYPE: issue
        run: |
          INPUT_TEXT="$(cat "$RUNNER_TEMP/issue-title.txt" "$RUNNER_TEMP/issue.md")"
          export INPUT_TEXT
          bash .github/workflows/validate-input.sh

      - name: Assign the issue to Copilot
        if: steps.issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
        run: |
          gh issue edit "$ISSUE_URL" --repo "$REPO" --add-assignee "@copilot"
          echo "Handed off $ISSUE_URL to the Copilot coding agent." >> "$GITHUB_STEP_SUMMARY"
