name: LOC Stats

on:
  schedule:
    # Run monthly on the 1st at 03:17 UTC.
    - cron: '17 3 1 * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/loc-stats.yml
      - scripts/loc-stats.js
      - scripts/loc-stats.test.js

permissions:
  contents: read

jobs:
  loc-stats:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && !startsWith(github.ref_name, 'dependabot/')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Run unit tests
        run: node --test scripts/loc-stats.test.js

      - name: Generate LOC stats
        run: |
          node scripts/loc-stats.js --out LOC_STATS.md
          cat LOC_STATS.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/loc-stats
          add-paths: |
            LOC_STATS.md
          commit-message: |
            chore: refresh monthly LOC & test-scenario stats

            Regenerates LOC_STATS.md via scripts/loc-stats.js, counting source
            LOC, test files, test LOC and discovered test scenarios per
            repository component.
          title: "chore: refresh monthly LOC & test-scenario stats"
          body: |
            This pull request regenerates `LOC_STATS.md` with the monthly lines of
            code and discovered test-scenario counts for every repository
            component.

            **What changed**
            - `LOC_STATS.md` regenerated by `scripts/loc-stats.js`.

            **What it reports (per component)**
            - Source files and source LOC (hand-written TS/JS/JSON/C#/Kotlin).
            - Test files, test LOC, and discovered test scenarios
              (`it`/`test`/`describe` for TS/JS, `[Fact]`/`[Theory]`/`[TestMethod]`
              for C#, `@Test`/`@ParameterizedTest` for Kotlin).

            Generated/bundled output, dependency directories and lockfiles are
            excluded so the numbers reflect hand-written code.

            ---
            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: |
            autogenerated
            maintenance
