# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  # Path gate for the two compiled languages.
  #
  # CodeQL supports [ $supported-codeql-languages ]
  # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support
  #
  # Each matrix entry only checks out and sets up the toolchain its own language
  # needs (see the sparse-checkout / conditional setup steps below):
  #   - actions / typescript: repo-wide, no compiled build required. These are
  #     cheap and always analyzed, so their check runs never go missing.
  #   - csharp: build-mode "manual", built via MSBuild on windows-latest
  #     (the visualstudio-extension/ classic VSSDK net48 project needs a
  #     real compiler pass — build-mode "none" left CodeQL's call-target
  #     quality metric at 82% (< 85% threshold) because the no-build
  #     extractor can't fully resolve the VS SDK / NuGet package types).
  #   - java-kotlin: build-mode "manual", built via the jetbrains-plugin/
  #     Gradle wrapper (compileKotlin only — buildPlugin isn't needed for
  #     extraction and would pull down the full IntelliJ Platform SDK).
  #
  # csharp and java-kotlin are the two slowest entries to build AND the two
  # slowest to be scheduled (csharp needs a scarce windows runner), while the
  # code they analyze changes in a minority of PRs. They are therefore added to
  # the matrix only when a PR actually touches them. On push to main and on the
  # weekly schedule the full matrix always runs, so the security dashboard
  # keeps full coverage regardless of what any individual PR touched.
  check-changes:
    name: Select languages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check which compiled sources changed
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            csharp:
              - 'visualstudio-extension/**'
              - '.github/workflows/codeql.yml'
              - '.github/codeql/**'
            jetbrains:
              - 'jetbrains-plugin/**'
              - '.github/workflows/codeql.yml'
              - '.github/codeql/**'

      - name: Build the language matrix
        id: build-matrix
        shell: bash
        env:
          # Anything that is not a pull_request (push to main, the weekly
          # schedule) analyzes every language.
          RUN_CSHARP: ${{ github.event_name != 'pull_request' || steps.filter.outputs.csharp == 'true' }}
          RUN_JETBRAINS: ${{ github.event_name != 'pull_request' || steps.filter.outputs.jetbrains == 'true' }}
        run: |
          set -euo pipefail
          entries='[{"language":"actions"},{"language":"typescript"}]'
          if [ "$RUN_CSHARP" = "true" ]; then
            entries=$(jq -c '. + [{"language":"csharp","build-mode":"manual","runs-on":"windows-latest","sparse-checkout":"visualstudio-extension\n.github\n"}]' <<<"$entries")
          fi
          if [ "$RUN_JETBRAINS" = "true" ]; then
            entries=$(jq -c '. + [{"language":"java-kotlin","build-mode":"manual","sparse-checkout":"jetbrains-plugin\n.github\n"}]' <<<"$entries")
          fi
          echo "Analyzing: $(jq -r '[.[].language] | join(", ")' <<<"$entries")"
          echo "matrix=$entries" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze
    needs: check-changes
    runs-on: ${{ matrix.runs-on || 'ubuntu-latest' }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check-changes.outputs.matrix) }}

    steps:
      - name: Harden the runner (Block all outbound calls except allowed)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          # Allowlist inferred from the harden-runner audit output of the 10 most
          # recent successful runs of this workflow (run ids 28795598756..28802374085),
          # plus the well-known endpoints the csharp/java-kotlin matrix entries added
          # below need (Gradle wrapper distribution, Gradle Plugin Portal, Maven
          # Central, JetBrains' IntelliJ Platform repositories, Temurin JDK). These
          # were proactively added and then trued up against real run failures — see
          # the PR description for the endpoints actually observed as blocked.
          # Use a wildcard for the rotating Actions results storage account names.
          # The *.githubusercontent.com hosts serve the CodeQL bundle download when
          # the requested version is not in the runner's toolcache (release
          # downloads on github.com redirect there) — without them, init fails
          # with ECONNREFUSED on runner images that lack the pinned version.
          # api.nuget.org / globalcdn.nuget.org: the csharp matrix entry builds
          # via `nuget restore` + `msbuild` (build-mode "manual"), and the C#
          # extractor under build-mode "none" also restores NuGet itself. Either
          # way, restoring the VS SDK / VSSDK / NuGet package references needs
          # these endpoints — without them the restore is silently blocked by
          # egress-policy, degrading database quality ("Low C# analysis quality" /
          # percentage of calls with call target below the 85% threshold).
          allowed-endpoints: >
            api.adoptium.net:443
            api.github.com:443
            api.nuget.org:443
            cache-redirector.jetbrains.com:443
            # d2cico3c979uwg.cloudfront.net is the CloudFront distribution that
            # download-cdn.jetbrains.com itself resolves/redirects to when the
            # IntelliJ Platform Gradle plugin fetches the IC IDE distribution.
            d2cico3c979uwg.cloudfront.net:443
            data.services.jetbrains.com:443
            download-cdn.jetbrains.com:443
            download.jetbrains.com:443
            github.com:443
            globalcdn.nuget.org:443
            hosted-compute-watchdog-prod-*.githubapp.com:443
            objects.githubusercontent.com:443
            plugins-artifacts.gradle.org:443
            plugins.gradle.org:443
            productionresultssa*.blob.core.windows.net:443
            release-assets.githubusercontent.com:443
            repo.maven.apache.org:443
            repo1.maven.org:443
            results-receiver.actions.githubusercontent.com:443
            services.gradle.org:443
            uploads.github.com:443
            www.jetbrains.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ${{ matrix.sparse-checkout }}

      - name: Set up Java 21 (Temurin)
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # CodeQL needs to observe an actual compiler invocation between the
          # init and analyze steps. If this action restores a previous run's
          # Gradle User Home (including the local build cache), Gradle can mark
          # compileKotlin/compileTestKotlin as UP-TO-DATE without ever invoking
          # kotlinc — CodeQL then sees no compilation and fails with "No source
          # code was seen during the build" / exit code 32. Disable caching for
          # this job so the build always compiles for real under the tracer.
          cache-disabled: true

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Use the broader security-extended query suite (adds lower-precision /
          # lower-severity security queries on top of the default security-and-quality
          # set) across every language in the matrix.
          queries: security-extended
          # Exclude committed *generated* build artifacts (the minified Visual
          # Studio webview bundles) from analysis. Their hand-written TypeScript
          # source in vscode-extension/src/webview/** is still scanned. See the
          # config file for the full rationale.
          config-file: ./.github/codeql/codeql-config.yml
          # If you wish to specify custom queries, you can do so here or in a config file.
          # By default, queries listed here will override any specified in a config file.
          # Prefix the list here with "+" to use these queries and those in the config file.

      # build-mode: manual — trace the JetBrains plugin's own Gradle wrapper build.
      # compileKotlin/compileTestKotlin is enough for extraction; buildPlugin would
      # additionally download and assemble the full IntelliJ Platform distribution.
      - name: Build JetBrains plugin (Gradle)
        if: matrix.language == 'java-kotlin'
        working-directory: jetbrains-plugin
        # --rerun-tasks / --no-build-cache force Gradle to actually invoke the
        # Kotlin/Java compilers rather than restoring UP-TO-DATE task outputs
        # from the (now-disabled, but belt-and-braces) build cache — see the
        # comment on the "Setup Gradle" step above for why that matters to CodeQL.
        run: ./gradlew compileKotlin compileTestKotlin --no-daemon --rerun-tasks --no-build-cache

      # build-mode: manual — trace the Visual Studio extension's MSBuild build.
      # The classic (non-SDK-style) net48 VSSDK project needs a real compiler
      # pass so CodeQL can resolve the VS SDK / NuGet package types (the no-build
      # extractor's call-target metric sat at 82%, below the 85% threshold).
      # The whole solution is built so the runner and test projects are also
      # extracted (matching what build-mode "none" scanned before). The
      # webview-bundle / cli-bundle copy targets (CopyWebviewBundles /
      # AddCliBundleToVsix) would pull in vscode-extension and cli build outputs
      # that aren't checked out here, so CopyWebviewBundles is skipped via
      # /p:CopyWebviewBundles=false (AddCliBundleToVsix only runs during VSIX
      # packaging, not /t:Build). nuget restore is required first for the VSSDK
      # PackageReference packages; dotnet restore is needed for the SDK-style
      # test project (mirrors .github/workflows/visualstudio-build.yml).
      - name: Add MSBuild to PATH
        if: matrix.language == 'csharp'
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      # Unlike the Gradle build cache disabled above, caching the NuGet global
      # packages folder is safe under CodeQL tracing: it only avoids
      # re-downloading packages, it never lets MSBuild skip a compiler
      # invocation. The `msbuild ... /t:Build` step below still compiles for
      # real, so the extractor keeps seeing source.
      - name: Cache NuGet packages (C#)
        if: matrix.language == 'csharp'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('visualstudio-extension/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore NuGet packages (C#)
        if: matrix.language == 'csharp'
        working-directory: visualstudio-extension
        # -LockedMode: fail if a PackageReference drifts from the committed
        # packages.lock.json instead of resolving something new (see
        # visualstudio-extension/Directory.Build.props).
        run: nuget restore AIEngineeringFluency.sln -LockedMode

      - name: Restore test project (SDK-style)
        if: matrix.language == 'csharp'
        working-directory: visualstudio-extension
        run: |
          dotnet restore --locked-mode src/AIEngineeringFluency.Tests/AIEngineeringFluency.Tests.csproj
          dotnet restore --locked-mode src/AIEngineeringFluencyRunner/AIEngineeringFluencyRunner.csproj

      - name: Build C# solution (CodeQL tracing)
        if: matrix.language == 'csharp'
        working-directory: visualstudio-extension
        run: >-
          msbuild AIEngineeringFluency.sln
          /p:Configuration=Release
          /p:Platform="Any CPU"
          /p:CopyWebviewBundles=false
          /t:Build
          /v:minimal

      # Autobuild attempts to build any compiled languages (C/C++, C#, or Java)
      # that aren't otherwise handled above. csharp and java-kotlin are both
      # built manually above, so this only ever runs for languages that fall
      # through to CodeQL's default build-mode.
      - name: Autobuild
        if: matrix.language != 'csharp' && matrix.language != 'java-kotlin'
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      # ℹ️ Command-line programs to run using the OS shell.
      # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun

      #   If the Autobuild fails above, remove it and uncomment the following three lines.
      #   modify them (or add more) to build your code if your project, please refer to the EXAMPLE below for guidance.

      # - run: |
      #   echo "Run, Build Application using script"
      #   ./location_of_script_within_repo/buildscript.sh

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{matrix.language}}"

  # Stable required-check anchor - see the same pattern in build.yml.
  #
  # analyze's matrix is built by check-changes, so the per-language check runs
  # ("Analyze (csharp, ...)", "Analyze (java-kotlin, ...)") are ABSENT, not
  # skipped, on a PR touching neither visualstudio-extension/ nor
  # jetbrains-plugin/. Requiring those names would hang such PRs forever.
  #
  # Require "CodeQL result" in branch protection rather than the per-language
  # entries.
  codeql-result:
    name: CodeQL result
    runs-on: ubuntu-latest
    needs: [check-changes, analyze]
    if: always()
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # The composite action below is a local action (./.github/actions/...),
      # which needs the repo checked out at this path to be found at all -
      # without this, the step fails with "Can't find 'action.yml' ...".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the gated job results
        uses: ./.github/actions/check-gated-results
        with:
          gate-name: check-changes (Select languages)
          gate-result: ${{ needs.check-changes.result }}
          results: |
            analyze=${{ needs.analyze.result }}
