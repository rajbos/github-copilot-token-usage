name: Sync Tool Names from vscode-copilot-chat

on:
  # No workflow_dispatch on purpose: a dispatch against another branch loads that
  # branch's workflow definition (and script) with this job's write token, and
  # nothing inside the file can prevent that. schedule and push-to-main always
  # run the default branch's reviewed definition.
  schedule:
    - cron: '30 17 * * 1'  # Run every Monday at 17:30 UTC
  push:
    # main only: the privileged job (contents/pull-requests: write) must never
    # run a script from an unreviewed branch.
    branches: [main]
    paths:
      - .github/workflows/sync-toolnames.yml
      - .github/scripts/sync_toolnames.py

permissions:
  contents: read

jobs:
  sync-toolnames:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]' && !startsWith(github.ref_name, 'dependabot/')
    permissions:
      contents: write  # Need write permission to create branches and push changes
      pull-requests: write  # Need write permission to create PRs
      
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Checkout current repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: current-repo
        fetch-depth: 0
        
    - name: Checkout vscode-copilot-chat repository
      # Untrusted third-party content: parsed as data only, never fed to an agent.
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: microsoft/vscode-copilot-chat
        path: vscode-copilot-chat
        fetch-depth: 1
        persist-credentials: false

    # Deterministic, agent-free sync. Previously a Copilot CLI agent with
    # --allow-all-tools and GH_PAT in its environment read the upstream repo,
    # so prompt injection in upstream text could run shell commands and
    # exfiltrate the PAT. This step has no secrets and parses two enums with a
    # regex; the trusted script comes from this repository's checkout.
    - name: Sync toolNames.json from upstream enums
      working-directory: current-repo
      run: |
        echo "Upstream commit: $(git -C "${GITHUB_WORKSPACE}/vscode-copilot-chat" rev-parse HEAD)"
        echo "Upstream file: src/extension/tools/common/toolNames.ts"
        cp src/toolNames.json "${RUNNER_TEMP}/toolNames.base.json"
        python3 .github/scripts/sync_toolnames.py \
          --upstream-file "${GITHUB_WORKSPACE}/vscode-copilot-chat/src/extension/tools/common/toolNames.ts" \
          --tool-names src/toolNames.json
        # Historical duplicates in the committed mapping are tolerated; only
        # duplicates introduced by this sync fail the run.
        python3 .github/scripts/toolnames_utils.py --base "${RUNNER_TEMP}/toolNames.base.json"

    - name: Check for changes
      id: changes
      working-directory: current-repo
      run: |
        if git diff --quiet -- src/toolNames.json; then
          echo "No changes detected in toolNames.json"
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "Changes detected in toolNames.json"
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Create Pull Request
      if: steps.changes.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        path: current-repo
        branch: sync-toolnames
        add-paths: |
          src/toolNames.json
        commit-message: |
          chore: sync toolNames.json with vscode-copilot-chat
          
          This commit automatically updates src/toolNames.json with new tool
          identifiers from microsoft/vscode-copilot-chat repository.
          
          Source: microsoft/vscode-copilot-chat
          File: src/extension/tools/common/toolNames.ts
        title: "chore: sync toolNames.json with vscode-copilot-chat"
        body: |
          This pull request updates `src/toolNames.json` with new tool identifiers
          found in the `microsoft/vscode-copilot-chat` repository.
          
          **Source Repository:** microsoft/vscode-copilot-chat
          **Source File:** src/extension/tools/common/toolNames.ts
          
          The changes were automatically generated by scanning the upstream repository
          and comparing tool IDs with our existing mapping.
          
          Please review the new entries to ensure the friendly names are appropriate.
        labels: |
          autogenerated
        
    - name: Summary
      working-directory: current-repo
      run: |
        if [ "${{ steps.changes.outputs.changed }}" == "true" ]; then
          echo "✅ toolNames.json has been successfully updated with new tool names from vscode-copilot-chat"
          echo ""
          echo "A pull request has been created for review."
        else
          echo "ℹ️ toolNames.json was already up to date with vscode-copilot-chat"
        fi
