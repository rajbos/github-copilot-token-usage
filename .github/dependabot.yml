version: 2
updates:
  # Enable version updates for npm dependencies
  - package-ecosystem: "npm"
    directories: ["/vscode-extension", "/sharing-server"]
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "npm"
      include: "scope"
    reviewers:
      - "rajbos"
    assignees:
      - "rajbos"
    labels:
      - "dependencies"
      - "npm"
    # Group minor and patch updates to reduce PR noise.
    # @types/vscode is excluded so its minor/patch bumps always land as their
    # own PR — grouping it with everything else let a bump silently outrun
    # engines.vscode and break the nightly VS Code packaging check.
    groups:
      minor-and-patch-updates:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/vscode"
        update-types:
          - "minor"
          - "patch"
    # @types/vscode bumps the minimum VS Code version enterprise users need
    # (engines.vscode must be >= @types/vscode or vsce refuses to package —
    # see the incident that broke the nightly pre-release for over a week).
    # Give each release 6 weeks before Dependabot even proposes it, so users
    # on an older VS Code build keep working; engines.vscode is bumped by hand
    # only when the code actually needs a newer API.
    cooldown:
      default-days: 42
      include:
        - "@types/vscode"
    # Allow both devDependencies and dependencies updates
    ignore:
      # Ignore major version updates for stable dependencies
      # These should be handled manually to avoid breaking changes
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vscode"
        update-types: ["version-update:semver-major"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "github-actions"
      include: "scope"
    reviewers:
      - "rajbos"
    assignees:
      - "rajbos"
    labels:
      - "dependencies"
      - "github-actions"
    # Group minor and patch updates to reduce PR noise
    groups:
      minor-and-patch-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Enable version updates for the JetBrains plugin Gradle wrapper and dependencies
  - package-ecosystem: "gradle"
    directory: "/jetbrains-plugin"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "gradle"
      include: "scope"
    reviewers:
      - "rajbos"
    assignees:
      - "rajbos"
    labels:
      - "dependencies"
    groups:
      minor-and-patch-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Enable version updates for the Visual Studio extension NuGet dependencies
  - package-ecosystem: "nuget"
    directory: "/visualstudio-extension"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    reviewers:
      - "rajbos"
    assignees:
      - "rajbos"
    labels:
      - "dependencies"
    groups:
      minor-and-patch-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Hash-pinned Python requirements installed by copilot-setup-steps.yml
  # (.github/requirements/*.txt). Each .txt is a pip-compile --generate-hashes
  # lock of the matching .in file, so on a bump Dependabot re-runs pip-compile
  # and re-resolves every hash and transitive pin together. (When the .txt was
  # hand-written it only rewrote one line, and twice left a stale hash behind.)
  # check-pip-requirements.yml installs the result on every such PR.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    reviewers:
      - "rajbos"
    assignees:
      - "rajbos"
    labels:
      - "dependencies"

  # Enable version updates for the dev container configuration
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    reviewers:
      - "rajbos"
    assignees:
      - "rajbos"
    labels:
      - "dependencies"

  - package-ecosystem: npm
    directory: /.github/scripts
    schedule:
      interval: daily
    groups:
      minor-and-patch-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: /.github/skills/azure-storage-loader
    schedule:
      interval: daily
    groups:
      minor-and-patch-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: /cli
    schedule:
      interval: daily
    groups:
      minor-and-patch-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: daily
    groups:
      minor-and-patch-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
